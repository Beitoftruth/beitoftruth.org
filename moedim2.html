<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Weekly Parsha – Beit Emet</title>

<link rel="stylesheet" href="assets/bootstrap/css/bootstrap.min.css">

<style>
    body {
        background-color: #000;
        color: #fff;
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
    }

    h1 {
        text-align: center;
        margin-top: 25px;
        font-size: 2.4rem;
        font-weight: bold;
    }

    .parsha-wrapper {
        max-width: 1100px;
        margin: auto;
        padding: 20px;
    }

    .parsha-card {
        background: #fff;
        color: #000;
        border-radius: 1rem;
        padding: 1.5rem;
        margin-bottom: 1.5rem;
        box-shadow: 0 2px 6px rgba(255,255,255,0.15);
    }

    .parsha-date {
        text-align: center;
        font-style: italic;
        margin-bottom: 0.5rem;
        font-size: 1.1rem;
    }

    .hebrew {
        font-weight: bold;
        font-size: 2.4rem;
        text-align: center;
        direction: rtl;
    }

    .bigger {
        font-weight: bold;
        font-size: 1.8rem;
        text-align: center;
        margin-bottom: 1rem;
    }

    p {
        font-size: 1.15rem;
        margin: 0.4rem 0;
    }

    /* Study Guide Section */
    #parasha-plan {
        max-width: 1100px;
        margin: auto;
        padding: 20px;
    }

    .study-parasha {
        background: #ffffff;
        color: #000;
        padding: 18px;
        margin-bottom: 20px;
        border-radius: 10px;
        box-shadow: 0 2px 6px rgba(255,255,255,0.15);
    }

    .study-parasha .hebrew {
        font-size: 1.8rem;
        font-weight: bold;
        direction: rtl;
        text-align: right;
    }

    .translit {
        font-size: 1.2rem;
        font-style: italic;
        margin-top: 4px;
    }

    .english {
        font-size: 1.1rem;
        margin-bottom: 10px;
    }

    .date {
        font-weight: bold;
        margin-bottom: 10px;
    }

    ol {
        padding-left: 20px;
        margin-top: 8px;
    }
</style>

</head>
<body>

<h1>Weekly Parsha</h1>

<div class="parsha-wrapper">
    <div id="parsha-container"></div>
</div>

<script>
window.onload = async function () {

    // Load perpetual Israeli parshiot.json
    async function loadParshiot() {
        const response = await fetch('parshiot.json');
        const data = await response.json();
        return data.parshiot;
    }

    // Get the upcoming Shabbat (Saturday)
    function getCurrentShabbat() {
        const today = new Date();
        const day = today.getDay(); // 0=Sun ... 6=Sat
        const diff = (6 - day + 7) % 7;
        const shabbat = new Date(today);
        shabbat.setDate(today.getDate() + diff);
        return shabbat;
    }

    // Add or subtract days
    function addDays(date, days) {
        const d = new Date(date);
        d.setDate(d.getDate() + days);
        return d;
    }

    // Gregorian date formatting
    function formatGregorian(d) {
        return d.toLocaleDateString("en-US", {
            year: "numeric",
            month: "long",
            day: "numeric"
        });
    }

    // Hebrew date formatting
    function toHebrewDate(gDate) {
        return new Intl.DateTimeFormat("he-u-ca-hebrew", {
            day: "numeric",
            month: "long",
            year: "numeric"
        }).format(gDate);
    }

    // Combined date format
    function formatFullDate(d) {
        return `${formatGregorian(d)} • ${toHebrewDate(d)}`;
    }

    // Determine week number of the year
    function getWeekNumber(date) {
        const start = new Date(date.getFullYear(), 0, 1);
        const diff = date - start;
        return Math.floor(diff / (7 * 24 * 60 * 60 * 1000));
    }

    // Render previous, current, next parsha
    function renderThree(parshiot, index, prevDate, currDate, nextDate) {
        const container = document.getElementById('parsha-container');
        container.innerHTML = "";

        const prev = parshiot[(index - 1 + parshiot.length) % parshiot.length];
        const curr = parshiot[index];
        const next = parshiot[(index + 1) % parshiot.length];

        const list = [
            { p: prev, d: prevDate },
            { p: curr, d: currDate },
            { p: next, d: nextDate }
        ];

        list.forEach(item => {
            container.innerHTML += `
                <div class="parsha-card">
                    <div class="parsha-date">${formatFullDate(item.d)}</div>
                    <div class="hebrew">${item.p.nameHe}</div>
                    <div class="bigger">${item.p.nameEn}</div>
                    <p><strong>Torah:</strong> ${item.p.torah}</p>
                    <p><strong>Haftarah:</strong> ${item.p.haftarah}</p>
                    <p><strong>Brit Chadashah:</strong> ${item.p.brit}</p>
                </div>
            `;
        });
    }

    // MAIN EXECUTION
    const parshiot = await loadParshiot();

    const currentShabbat = getCurrentShabbat();
    const previousShabbat = addDays(currentShabbat, -7);
    const nextShabbat = addDays(currentShabbat, 7);

    const weekNumber = getWeekNumber(currentShabbat);
    const index = weekNumber % parshiot.length;

    renderThree(parshiot, index, previousShabbat, currentShabbat, nextShabbat);
};
</script>

</body>
</html>
